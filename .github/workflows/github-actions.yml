name: Update holidays.json

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  get-holidays:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest holidays
        run: node ./.github/workflows/fetchHolidays.js

      - name: Move holidays.json to $lib
        run: |
          mv holidays.json ./src/lib/holidays.json

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ./src/lib/holidays.json
          git diff --cached --quiet || (git commit -m "Automatically update holidays.json" && git push)
      - name: Push changes
        uses: ad-m/github-push-action@master
